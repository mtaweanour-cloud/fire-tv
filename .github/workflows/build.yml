name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk FireTV-AirPlay.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" FireTV-AirPlay.apk \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatic build of ${GITHUB_SHA::7}" \
            --latest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: FireTV-AirPlay.apk
          if-no-files-found: ignore
